<title>Vasen 4 kuollut – arvaa peli konesuomennoksesta</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#0E1B33;--surface:#16264A;--deep:#0A1529;--text:#F5F1E6;--soft:#D9DDE8;--muted:#B8C0D4;--dim:#8A94AB;--line:rgba(255,255,255,.12);--accent:#FFC857;--green:#8FE3A1;--red:#FF8A7A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;font-size:17px;line-height:1.5;min-height:100vh}
a{color:var(--accent)}a:hover{color:#FFD98A}
.wrap{max-width:720px;margin:0 auto;padding:48px 20px 96px;display:flex;flex-direction:column;gap:28px}
.screen{display:flex;flex-direction:column;gap:28px}
.mono{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mono.accent{color:var(--accent);letter-spacing:.12em}
.display{font-family:'Bricolage Grotesque','IBM Plex Sans',sans-serif;font-weight:800;letter-spacing:-.02em;line-height:.95}
h1{margin:0;font-size:clamp(48px,10vw,92px);color:var(--text)}
.lead{margin:0;font-size:19px;max-width:560px;color:var(--soft)}
.card{display:flex;flex-direction:column;gap:14px;padding:24px 28px;background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:20px}
.rule{display:flex;gap:14px;align-items:baseline;color:var(--soft)}
.rule b{flex:0 0 auto;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;color:var(--accent)}
.fine{margin-top:4px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--muted)}
.fine strong{color:var(--text);font-weight:600}
.fine .lit{color:var(--text)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:transform .08s ease,filter .15s ease,background .15s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-big{font-size:18px;min-height:56px;padding:0 32px}
.btn-secondary{background:transparent;color:var(--text);border-color:rgba(255,255,255,.3)}
.btn-secondary:hover{background:rgba(255,255,255,.08)}
.btn-small{min-height:44px;padding:0 18px;font-size:15px}
.btn-ghost{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;font-size:15px;min-height:44px}
.btn-ghost:hover{color:var(--text)}
.seg{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--text);font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.seg:hover{background:rgba(255,255,255,.08)}
.seg.on,.seg.on:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.foot{margin:0;font-size:14px;color:var(--dim)}
.play{display:flex;flex-direction:column;gap:24px}
.topbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.topbar strong{color:var(--accent);font-size:16px;margin-left:4px}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar div{height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}
.title-card{display:flex;flex-direction:column;gap:10px;padding:36px 32px;background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:20px}
.fi{font-size:clamp(32px,6.5vw,54px);line-height:1.05;letter-spacing:-.015em;overflow-wrap:anywhere}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:15px;font-weight:600;color:var(--soft)}
.inputrow{display:flex;gap:10px;flex-wrap:wrap}
.guess{flex:1 1 260px;min-width:0;min-height:52px;padding:0 16px;font:inherit;font-size:18px;color:var(--text);background:var(--deep);border:1px solid rgba(255,255,255,.22);border-radius:12px}
.guess::placeholder{color:var(--dim)}
.guess:focus{border-color:var(--accent)}
.feedback{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;min-height:24px}
.msg{font-size:15px;font-weight:500;color:var(--red)}
.hints{display:flex;flex-direction:column;gap:4px}
.hints-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:10px}
.hint-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.hint{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);min-height:72px}
.hint .mono{flex:0 0 128px;letter-spacing:.08em}
.hint .val{flex:1 1 220px;font-weight:500}
.hint .lock{flex:1 1 220px;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--dim)}
.giveup{display:flex;justify-content:flex-end;padding-top:6px}
.result{display:flex;flex-direction:column;gap:16px;padding:28px 32px;background:var(--deep);border:1px solid var(--c);border-radius:20px}
.result-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;color:var(--c)}
.result-head div{font-size:17px;font-weight:600}
.result-head .mono{color:var(--c);font-size:14px;letter-spacing:.08em}
.en{font-size:clamp(26px,4.5vw,38px);line-height:1.1;letter-spacing:-.01em}
.note{font-size:16px;color:var(--soft)}
.note span{color:var(--dim)}
.facts{display:flex;flex-wrap:wrap;gap:16px 24px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.fact{flex:1 1 200px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.fact.year{flex:0 1 160px}
.fact .mono{font-size:12px;color:var(--dim)}
.score{font-size:clamp(56px,12vw,112px);letter-spacing:-.03em}
.score span{color:var(--accent)}
.score small{color:var(--dim);font-size:.5em;font-weight:500}
.verdict{margin:0;font-size:21px;line-height:1.4;color:var(--soft);max-width:560px}
.results{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.res{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.res .names{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:2px}
.res .names div:first-child{font-weight:600;overflow-wrap:anywhere}
.res .names div:last-child{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.res .mono{flex:0 0 auto;font-size:14px;letter-spacing:.08em}
.ok{color:var(--green)}.bad{color:var(--red)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>

var GAMES = RAW.map(function (r) { return { fi: r[0], en: r[1], note: r[2], who: r[3], year: r[4], genre: r[5] }; });

// Hyväksytty vastaus: sama nimi kuin Microsoftin listalla. Kirjainkoko, välimerkit, välilyönnit ja tarkkeet (ö → o) eivät vaikuta; kirjainten ja numeroiden pitää täsmätä.
function strict(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "");
}
function isCorrect(guess, game) {
  var g = strict(guess);
  return g.length > 0 && g === strict(game.en);
}
// Löysempi vertailu vain palautetta varten ("lähellä, tarkista kirjoitusasu").
var ROMAN = { ii: "2", iii: "3", iv: "4", v: "5", vi: "6", vii: "7", viii: "8", ix: "9" };
function loose(s) {
  s = String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  s = s.replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").trim();
  var toks = s.split(" ").filter(Boolean).map(function (t) { return ROMAN[t] || t; });
  toks = toks.filter(function (t) { return t !== "the" && t !== "a"; });
  return toks.join(" ");
}
function lev(a, b) {
  if (a === b) return 0;
  var m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  var prev = [], cur = [], i, j;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {
    cur[0] = i;
    for (j = 1; j <= n; j++) {
      var cost = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
    }
    var t = prev; prev = cur; cur = t;
  }
  return prev[n];
}
function tolerance(len) { return len <= 4 ? 0 : len <= 9 ? 1 : len <= 16 ? 2 : 3; }
function isNear(guess, game) {
  var a = loose(guess), b = loose(game.en);
  if (!a || !b) return false;
  if (a === b) return true;
  if (lev(a, b) <= tolerance(Math.min(a.length, b.length))) return true;
  var a2 = a.replace(/ /g, ""), b2 = b.replace(/ /g, "");
  return lev(a2, b2) <= tolerance(Math.min(a2.length, b2.length));
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
var MAX_ATTEMPTS = 3;
var WRONG = ["Ei ole.", "Ei sekään.", "Ei vieläkään."];
var NEAR = "Lähellä! Tarkista kirjoitusasu.";
function ptsLabel(pts, short) {
  if (pts <= 0) return "0 " + (short ? "p" : "pistettä");
  if (short) return "+" + pts + " p";
  return "+" + pts + (pts === 1 ? " piste" : " pistettä");
}
function verdict(ratio) {
  if (ratio >= 0.9) return "Lokalisoinnin laadunvalvoja. Microsoftin olisi kannattanut palkata sinut ennen sivun julkaisua.";
  if (ratio >= 0.7) return "Sujuvaa konesuomea. Kääntäjä olisi ylpeä, jos osaisi tuntea jotain.";
  if (ratio >= 0.45) return "Ihan hyvä – vihjeet tosin tekivät osan töistä.";
  if (ratio >= 0.2) return "Hukassa käännöksessä, löytyi vihjeillä.";
  return "Vasen 4 kuollut, todellakin. Uusi kierros?";
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; });
}

var app = document.getElementById("app");
var state = { screen: "start", len: 10, order: [], qi: 0, score: 0, guess: "", attempts: 0, hints: 0, status: "open", results: [], message: "" };

function current() { return state.order.length ? GAMES[state.order[state.qi]] : GAMES[0]; }
function setState(patch) { Object.assign(state, patch); render(); }

function startRound() {
  var n = Math.min(state.len, GAMES.length);
  var order = shuffle(GAMES.map(function (_, i) { return i; })).slice(0, n);
  setState({ screen: "play", order: order, qi: 0, score: 0, guess: "", attempts: 0, hints: 0, status: "open", results: [], message: "" });
  focusInput();
}
function resolve(status, pts) {
  var g = current();
  setState({ status: status, score: state.score + pts, results: state.results.concat([{ fi: g.fi, en: g.en, pts: pts }]), message: "" });
  var btn = document.getElementById("next");
  if (btn) btn.focus();
}
function submit() {
  if (state.status !== "open") return;
  var input = document.getElementById("guess");
  var guess = String(input ? input.value : state.guess).trim();
  if (!guess) return;
  var game = current();
  if (isCorrect(guess, game)) { resolve("correct", Math.max(1, 4 - state.hints)); return; }
  var attempts = state.attempts + 1;
  if (attempts >= MAX_ATTEMPTS) { state.attempts = attempts; resolve("failed", 0); return; }
  var near = isNear(guess, game);
  // Läheltä piti -arvaus jätetään kenttään korjattavaksi, muuten kenttä tyhjennetään.
  setState({ attempts: attempts, guess: near ? guess : "", message: near ? NEAR : WRONG[(attempts - 1) % WRONG.length] });
  focusInput(near);
}
function revealHint(i) {
  if (state.status !== "open" || state.hints !== i || state.hints >= 3) return;
  setState({ hints: state.hints + 1 });
  focusInput(true);
}
function giveUp() { if (state.status === "open") resolve("gaveup", 0); }
function next() {
  if (state.qi + 1 >= state.order.length) { setState({ screen: "end" }); return; }
  setState({ qi: state.qi + 1, guess: "", attempts: 0, hints: 0, status: "open", message: "" });
  focusInput();
}
function focusInput(keepCaretAtEnd) {
  var el = document.getElementById("guess");
  if (!el) return;
  el.focus();
  if (keepCaretAtEnd && el.value) { var n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {} }
}

var LOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';

function renderStart() {
  var all = GAMES.length;
  var lens = [10, 20, all].map(function (n) {
    return '<button type="button" class="seg' + (state.len === n ? " on" : "") + '" data-act="len" data-n="' + n + '">' + (n === all ? "Kaikki " + n : n + " nimeä") + "</button>";
  }).join("");
  return '<section class="screen">' +
    '<div class="mono">Microsoft Edge Game Assist · fi-FI · ' + all + ' nimeä</div>' +
    '<h1 class="display">Vasen 4<br>kuollut</h1>' +
    '<p class="lead">Microsoftin suomenkielinen tukisivu ajoi Edge Game Assistin pelilistan konekääntäjän läpi. Sinä saat sekaisin menneen suomennoksen – kerro, mikä peli oikeasti on kyseessä.</p>' +
    '<div class="card">' +
      '<div class="mono accent">Näin se toimii</div>' +
      '<div class="rule"><b>4</b><div>pistettä jokaisesta nimestä, jonka tiedät ilman vihjeitä.</div></div>' +
      '<div class="rule"><b>−1</b><div>jokaisesta vihjeestä. Ne avautuvat aina samassa järjestyksessä: ohjaaja, julkaisuvuosi, genre.</div></div>' +
      '<div class="rule"><b>0</b><div>kolmen väärän arvauksen tai luovuttamisen jälkeen. Vastaus näytetään ja peli jatkuu.</div></div>' +
      '<div class="fine">' +
        '<div>Vastaukseksi kelpaa vain pelin oikea englanninkielinen nimi, niin kuin se on Microsoftin listalla. Kirjainkoolla ja välimerkeillä ei ole väliä, mutta lyhenteet kuten <span class="lit">rdr2</span> eivät kelpaa.</div>' +
        '<div>Esimerkki: <strong>Vasen 4 kuollut 2</strong> → Left 4 Dead 2. Kääntäjä luki sanan "left" suuntana.</div>' +
      '</div>' +
    '</div>' +
    '<div class="row"><span class="mono" style="margin-right:6px">Kierroksen pituus</span>' + lens + '</div>' +
    '<div><button type="button" class="btn btn-primary btn-big" data-act="start">Aloita</button></div>' +
    '<p class="foot">Nimet sellaisinaan sivulta <a href="https://support.microsoft.com/fi-fi/edge/enhanced-games-for-microsoft-edge-game-assist" target="_blank" rel="noopener">support.microsoft.com (fi-FI)</a>. Faktat pelien Wikipedia-artikkeleista.</p>' +
  '</section>';
}

function renderPlay() {
  var g = current();
  var open = state.status === "open";
  var done = state.qi + (open ? 0 : 1);
  var pct = state.order.length ? Math.round(done / state.order.length * 100) : 0;
  var left = MAX_ATTEMPTS - state.attempts;
  var html = '<section class="play">' +
    '<div class="topbar mono"><span>Nimi ' + (state.qi + 1) + ' / ' + state.order.length + '</span><span>Pisteet <strong>' + state.score + '</strong></span></div>' +
    '<div class="bar"><div style="width:' + pct + '%"></div></div>' +
    '<div class="title-card"><div class="mono accent">Suomeksi</div><div class="display fi">' + esc(g.fi) + '</div></div>';

  if (open) {
    var defs = [["Ohjaaja", "ohjaaja", g.who], ["Julkaisuvuosi", "julkaisuvuosi", g.year], ["Genre", "genre", g.genre]];
    var hints = defs.map(function (d, i) {
      var body;
      if (state.hints > i) body = '<div class="val">' + esc(d[2]) + '</div>';
      else if (state.hints === i) body = '<button type="button" class="btn btn-secondary btn-small" data-act="hint" data-i="' + i + '">Näytä ' + d[1] + '</button>';
      else body = '<div class="lock">' + LOCK + '<span>Avautuu, kun edellinen vihje on käytetty</span></div>';
      return '<div class="hint"><div class="mono">' + d[0] + '</div>' + body + '</div>';
    }).join("");
    html +=
      '<div class="form">' +
        '<label for="guess">Mikä on pelin oikea nimi?</label>' +
        '<div class="inputrow">' +
          '<input id="guess" class="guess" type="text" value="' + esc(state.guess) + '" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="Kirjoita englanninkielinen nimi…">' +
          '<button type="button" class="btn btn-primary" data-act="submit">Arvaa</button>' +
        '</div>' +
        '<div class="feedback"><div class="msg" role="status">' + esc(state.message) + '</div><div class="mono">' + (left === 1 ? "1 arvaus jäljellä" : left + " arvausta jäljellä") + '</div></div>' +
      '</div>' +
      '<div class="hints">' +
        '<div class="hints-head"><div class="mono accent">Vihjeet</div><div class="mono">−1 piste / vihje</div></div>' +
        '<div class="hint-list">' + hints + '</div>' +
        '<div class="giveup"><button type="button" class="btn-ghost" data-act="giveup">Luovutan, näytä vastaus</button></div>' +
      '</div>';
  } else {
    var last = state.results[state.results.length - 1];
    var pts = last ? last.pts : 0;
    var correct = state.status === "correct";
    var head = correct ? (pts === 4 ? "Oikein, ilman vihjeitä!" : "Oikein!") : state.status === "failed" ? "Arvaukset loppuivat. Oikea vastaus:" : "Oikea vastaus:";
    var isLast = state.qi + 1 >= state.order.length;
    html +=
      '<div class="result" style="--c:' + (correct ? "var(--green)" : "var(--red)") + '">' +
        '<div class="result-head"><div>' + head + '</div><div class="mono">' + ptsLabel(pts, false) + '</div></div>' +
        '<div class="display en">' + esc(g.en) + '</div>' +
        '<div class="note"><span>Käännöksestä:</span> ' + esc(g.note) + '</div>' +
        '<div class="facts">' +
          '<div class="fact"><div class="mono">Ohjaaja</div><div>' + esc(g.who) + '</div></div>' +
          '<div class="fact year"><div class="mono">Julkaistu</div><div>' + esc(g.year) + '</div></div>' +
          '<div class="fact"><div class="mono">Genre</div><div>' + esc(g.genre) + '</div></div>' +
        '</div>' +
        '<div><button type="button" id="next" class="btn btn-primary" data-act="next">' + (isLast ? "Näytä tulokset" : "Seuraava nimi") + '</button></div>' +
      '</div>';
  }
  return html + '</section>';
}

function renderEnd() {
  var max = state.order.length * 4;
  var rows = state.results.map(function (r) {
    return '<div class="res"><div class="names"><div>' + esc(r.fi) + '</div><div>' + esc(r.en) + '</div></div><div class="mono ' + (r.pts > 0 ? "ok" : "bad") + '">' + ptsLabel(r.pts, true) + '</div></div>';
  }).join("");
  return '<section class="screen">' +
    '<div class="mono">Kierros pelattu · ' + state.order.length + ' nimeä</div>' +
    '<div><div class="display score"><span>' + state.score + '</span><small> / ' + max + '</small></div>' +
    '<p class="verdict">' + verdict(max ? state.score / max : 0) + '</p></div>' +
    '<div class="results">' + rows + '</div>' +
    '<div class="row"><button type="button" class="btn btn-primary" data-act="start">Pelaa uudestaan</button><button type="button" class="btn btn-secondary" data-act="restart">Vaihda kierroksen pituutta</button></div>' +
  '</section>';
}

function render() {
  app.innerHTML = state.screen === "start" ? renderStart() : state.screen === "play" ? renderPlay() : renderEnd();
}

app.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act");
  if (act === "len") setState({ len: Number(t.getAttribute("data-n")) });
  else if (act === "start") startRound();
  else if (act === "restart") setState({ screen: "start" });
  else if (act === "submit") submit();
  else if (act === "hint") revealHint(Number(t.getAttribute("data-i")));
  else if (act === "giveup") giveUp();
  else if (act === "next") next();
});
app.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && e.target && e.target.id === "guess") { e.preventDefault(); submit(); }
});
app.addEventListener("input", function (e) {
  if (e.target && e.target.id === "guess") state.guess = e.target.value;
});

render();
</script>
